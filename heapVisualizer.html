<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heap Visualizer (Max-Heap/Min-Heap)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        select, input[type="text"], button {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        select {
            width: 150px;
        }
        input[type="text"] {
            width: 150px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .canvas-frame {
            border: 3px solid #2c3e50;
            border-radius: 8px;
            padding: 10px;
            background-color: #f8f9fa;
            margin-top: 20px;
            display: inline-block;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        canvas {
            border: 1px solid #ccc;
            background-color: white;
        }
        .deleted-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .element {
            width: 60px;
            height: 40px;
            background-color: #28a745;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
        }
        .element.highlight {
            background-color: #ff4d4d;
        }
        .section-title {
            font-size: 18px;
            color: #333;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Heap Visualizer (Max-Heap/Min-Heap)</h1>
    <div>
        <select id="heapType" onchange="resetHeap()">
            <option value="min">Min-Heap</option>
            <option value="max">Max-Heap</option>
        </select>
        <input type="text" id="heapInput" placeholder="Enter a number">
        <button onclick="insertHeap()">Insert</button>
        <button onclick="deleteExtremum()">Delete Min/Max</button>
    </div>
    <div class="section-title">Heap</div>
    <div class="canvas-frame">
        <canvas id="heapCanvas" width="900" height="600"></canvas>
    </div>
    <div class="section-title">Deleted Elements (Answer)</div>
    <div id="deletedVisual" class="deleted-container"></div>
</div>

<script>
    async function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    class HeapNode {
        constructor(value) {
            this.value = value;
            this.left = null;
            this.right = null;
        }
    }

    let heap = [];
    let root = null;
    let deletedValues = [];
    let heapType = 'min';

    const canvas = document.getElementById('heapCanvas');
    const ctx = canvas.getContext('2d');
    const deletedVisual = document.getElementById('deletedVisual');

    function resetHeap() {
        heapType = document.getElementById('heapType').value;
        heap = [];
        root = null;
        deletedValues = [];
        deletedVisual.innerHTML = '';
        renderHeap();
    }

    async function insertHeap() {
        const input = document.getElementById('heapInput').value.trim();
        const value = parseInt(input);
        if (isNaN(value)) {
            alert('Please enter a valid number.');
            return;
        }

        // Insert into array representation
        heap.push(value);
        await heapifyUp(heap.length - 1);
        await rebuildTree();
        renderHeap();

        // Clear input
        document.getElementById('heapInput').value = '';
    }

    async function heapifyUp(index) {
        let current = index;
        while (current > 0) {
            const parent = Math.floor((current - 1) / 2);
            const compare = heapType === 'min' ? heap[current] < heap[parent] : heap[current] > heap[parent];
            if (compare) {
                [heap[current], heap[parent]] = [heap[parent], heap[current]];
                current = parent;
                await highlightNode(current);
            } else {
                break;
            }
        }
    }

    async function deleteExtremum() {
        if (heap.length === 0) {
            alert('Heap is empty!');
            return;
        }

        const extremumValue = heap[0];
        deletedValues.push(extremumValue);
        const div = document.createElement('div');
        div.className = 'element highlight';
        div.textContent = extremumValue;
        deletedVisual.appendChild(div);
        await sleep(500);
        div.classList.remove('highlight');

        // Replace root with last element and heapify down
        heap[0] = heap.pop();
        if (heap.length > 0) {
            await heapifyDown(0);
        }
        await rebuildTree();
        renderHeap();
    }

    async function heapifyDown(index) {
        let current = index;
        const n = heap.length;

        while (true) {
            let extremum = current;
            const left = 2 * current + 1;
            const right = 2 * current + 2;

            if (left < n) {
                const compareLeft = heapType === 'min' ? heap[left] < heap[extremum] : heap[left] > heap[extremum];
                if (compareLeft) extremum = left;
            }
            if (right < n) {
                const compareRight = heapType === 'min' ? heap[right] < heap[extremum] : heap[right] > heap[extremum];
                if (compareRight) extremum = right;
            }

            if (extremum !== current) {
                [heap[current], heap[extremum]] = [heap[extremum], heap[current]];
                current = extremum;
                await highlightNode(current);
            } else {
                break;
            }
        }
    }

    async function rebuildTree() {
        // Convert array representation to tree representation
        if (heap.length === 0) {
            root = null;
            return;
        }

        const treeNodes = heap.map(value => new HeapNode(value));
        for (let i = 0; i < treeNodes.length; i++) {
            const left = 2 * i + 1;
            const right = 2 * i + 2;
            if (left < treeNodes.length) treeNodes[i].left = treeNodes[left];
            if (right < treeNodes.length) treeNodes[i].right = treeNodes[right];
        }
        root = treeNodes[0];
    }

    async function renderHeap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (root) {
            drawNode(root, canvas.width / 2, 50, 300);
        }
    }

    async function drawNode(node, x, y, spacing) {
        if (!node) return;

        ctx.beginPath();
        ctx.arc(x, y, 20, 0, 2 * Math.PI);
        ctx.fillStyle = '#007bff';
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(node.value, x, y + 5);

        if (node.left) {
            ctx.beginPath();
            ctx.moveTo(x, y + 20);
            ctx.lineTo(x - spacing / 2, y + 80);
            ctx.stroke();
            drawNode(node.left, x - spacing / 2, y + 80, spacing / 2);
        }
        if (node.right) {
            ctx.beginPath();
            ctx.moveTo(x, y + 20);
            ctx.lineTo(x + spacing / 2, y + 80);
            ctx.stroke();
            drawNode(node.right, x + spacing / 2, y + 80, spacing / 2);
        }
    }

    async function highlightNode(index) {
        const node = findNodeByIndex(index);
        if (node) {
            const pos = findNodePosition(node);
            if (pos) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 20, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff4d4d';
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(node.value, pos.x, pos.y + 5);
                await sleep(500);
                renderHeap();
            }
        }
    }

    function findNodeByIndex(index) {
        if (!root) return null;
        const queue = [root];
        let currentIndex = 0;
        while (queue.length > 0) {
            const node = queue.shift();
            if (currentIndex === index) return node;
            currentIndex++;
            if (node.left) queue.push(node.left);
            if (node.right) queue.push(node.right);
        }
        return null;
    }

    function findNodePosition(node) {
        let x = 0, y = 0;
        function traverse(n, level, pos) {
            if (n === node) {
                x = pos;
                y = 50 + (level - 1) * 80;
                return true;
            }
            if (n.left && traverse(n.left, level + 1, pos - 300 / (2 ** level))) return true;
            if (n.right && traverse(n.right, level + 1, pos + 300 / (2 ** level))) return true;
            return false;
        }
        traverse(root, 1, canvas.width / 2);
        return { x, y };
    }
</script>
</body>
</html>

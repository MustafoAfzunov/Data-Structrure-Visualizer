<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linked List Visualizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        input[type="text"] {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 300px;
        }
        input[type="text"][name="search"] {
            width: 150px;
        }
        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .visual-container, .deleted-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .node {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .element {
            width: 60px;
            height: 40px;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .element.highlight {
            background-color: #ff4d4d;
        }
        .deleted-container .element {
            background-color: #28a745;
        }
        .arrow {
            font-size: 20px;
            color: #333;
        }
        .section-title {
            font-size: 18px;
            color: #333;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Linked List Visualizer</h1>
        <div>
            <input type="text" id="listInput" placeholder="e.g., 3 + 4 * ( 5 - 2 )" required>
            <button onclick="insertList()">Insert All</button>
            <button onclick="deleteList()">Delete First</button>
            <input type="text" name="search" id="searchInput" placeholder="Search value">
            <button onclick="searchList()">Search</button>
        </div>
        <div class="section-title">Current Linked List</div>
        <div id="listVisual" class="visual-container"></div>
        <div class="section-title">Deleted Elements (Answer)</div>
        <div id="deletedVisual" class="deleted-container"></div>
    </div>

    <script>
        async function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        let linkedList = [];
        let tokens = [];
        let currentTokenIndex = 0;
        let deletedElements = [];

        const listVisual = document.getElementById('listVisual');
        const deletedVisual = document.getElementById('deletedVisual');

        async function insertList() {
            const input = document.getElementById('listInput').value.trim();
            if (!input) {
                alert('Please enter an expression.');
                return;
            }

            // Split input into tokens (numbers, operators, brackets)
            tokens = input.split(/\s+/);
            if (tokens.length === 0) {
                alert('No valid tokens found.');
                return;
            }

            // Clear the list if starting a new input
            if (currentTokenIndex === 0) {
                linkedList = [];
                listVisual.innerHTML = '';
                deletedElements = [];
                deletedVisual.innerHTML = '';
            }

            // Insert remaining tokens one by one
            while (currentTokenIndex < tokens.length) {
                const token = tokens[currentTokenIndex];
                // Validate token (number, operator, or bracket)
                if (!isNaN(token) || ['+', '-', '*', '/', '(', ')'].includes(token)) {
                    linkedList.push(token);
                    await renderList();
                    // Highlight the newly added node
                    const lastNode = listVisual.children[listVisual.children.length - 1]?.querySelector('.element');
                    if (lastNode) {
                        lastNode.classList.add('highlight');
                        await sleep(500);
                        lastNode.classList.remove('highlight');
                    }
                    currentTokenIndex++;
                } else {
                    alert(`Invalid token: ${token}`);
                    return;
                }
            }

            // Clear input after inserting all tokens
            document.getElementById('listInput').value = '';
        }

        async function deleteList() {
            if (linkedList.length === 0) {
                alert('Linked List is empty!');
                return;
            }

            // Delete the first element
            const firstNode = listVisual.firstChild;
            const firstElement = firstNode.querySelector('.element');
            firstElement.classList.add('highlight');
            await sleep(500);
            const deletedValue = linkedList.shift();
            listVisual.removeChild(firstNode);

            // Add to deleted elements
            deletedElements.push(deletedValue);
            const div = document.createElement('div');
            div.className = 'element';
            div.textContent = deletedValue;
            div.classList.add('highlight');
            deletedVisual.appendChild(div);
            await sleep(500);
            div.classList.remove('highlight');

            if (currentTokenIndex > 0 && linkedList.length === 0) {
                currentTokenIndex = 0; // Reset index when list is empty
            }
        }

        async function searchList() {
            const searchValue = document.getElementById('searchInput').value.trim();
            if (!searchValue) {
                alert('Please enter a value to search.');
                return;
            }

            if (linkedList.length === 0) {
                alert('Linked List is empty!');
                return;
            }

            let found = false;
            for (let i = 0; i < linkedList.length; i++) {
                const node = listVisual.children[i];
                const element = node.querySelector('.element');
                element.classList.add('highlight');
                await sleep(500);
                if (linkedList[i] === searchValue) {
                    found = true;
                    break;
                }
                element.classList.remove('highlight');
            }

            if (!found) {
                alert(`Value ${searchValue} not found in the linked list.`);
                await renderList(); // Reset highlights
            }
        }

        async function renderList() {
            listVisual.innerHTML = '';
            linkedList.forEach((value, index) => {
                const nodeDiv = document.createElement('div');
                nodeDiv.className = 'node';
                const elementDiv = document.createElement('div');
                elementDiv.className = 'element';
                elementDiv.textContent = value;
                nodeDiv.appendChild(elementDiv);
                if (index < linkedList.length - 1) {
                    const arrowDiv = document.createElement('div');
                    arrowDiv.className = 'arrow';
                    arrowDiv.textContent = '→';
                    nodeDiv.appendChild(arrowDiv);
                }
                listVisual.appendChild(nodeDiv);
            });
        }
    </script>
</body>
</html>

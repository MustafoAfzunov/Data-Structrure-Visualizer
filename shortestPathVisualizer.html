<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shortest Path Maze Visualizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f0f0f0;
      text-align: center;
    }
    .container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
    }
    button {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .visual-container {
      margin-top: 20px;
    }
    #mazeCanvas {
      border: 1px solid #ccc;
      margin-top: 20px;
    }
    .path-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    .element {
      width: 60px;
      height: 40px;
      background-color: #28a745;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      transition: all 0.3s ease;
    }
    .element.highlight {
      background-color: #ff4d4d;
    }
    .section-title {
      font-size: 18px;
      color: #333;
      margin-top: 20px;
    }
    #status {
      margin-top: 10px;
      font-size: 16px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Shortest Path Maze Visualizer</h1>
    <div>
      <button onclick="setStartPoint()">Set Start Point (A)</button>
      <button onclick="setEndPoint()">Set End Point (B)</button>
      <button onclick="findShortestPath()">Find Shortest Path</button>
    </div>
    <div style="margin-top: 10px;">
      <button onclick="setObstacleLevel('low')">Few Obstacles</button>
      <button onclick="setObstacleLevel('medium')">Medium Obstacles</button>
      <button onclick="setObstacleLevel('high')">Many Obstacles</button>
    </div>
    <div id="status">Click to set Start (A) and End (B) points, then find the path.</div>
    <div class="section-title">Maze</div>
    <div class="visual-container">
      <canvas id="mazeCanvas" width="600" height="400"></canvas>
    </div>
    <div class="section-title">Shortest Path (Answer)</div>
    <div id="pathVisual" class="path-container"></div>
  </div>

  <script>
    async function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    let maze = [];
    const rows = 10;
    const cols = 15;
    const cellSize = 40;
    let start = { row: 0, col: 0 };
    let end = { row: rows - 1, col: cols - 1 };
    let obstacleLevel = 'medium'; // 'low', 'medium', 'high'
    let settingStart = false;
    let settingEnd = false;

    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const pathVisual = document.getElementById('pathVisual');
    const status = document.getElementById('status');

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const row = Math.floor(y / cellSize);
      const col = Math.floor(x / cellSize);

      if (settingStart && row >= 0 && row < rows && col >= 0 && col < cols) {
        start = { row, col };
        settingStart = false;
        status.textContent = 'Start (A) set. Now set End (B) point or find path.';
        drawMaze();
      } else if (settingEnd && row >= 0 && row < rows && col >= 0 && col < cols) {
        end = { row, col };
        settingEnd = false;
        status.textContent = 'End (B) set. Click "Find Shortest Path" to proceed.';
        drawMaze();
      }
    });

    function setObstacleLevel(level) {
      obstacleLevel = level;
      alert(`Obstacle level set to: ${level}`);
      generateMaze();
      drawMaze();
    }

    function generateMaze() {
      maze = Array(rows).fill().map(() => Array(cols).fill(0));

      let density = 0.2;
      if (obstacleLevel === 'low') density = 0.1;
      else if (obstacleLevel === 'high') density = 0.35;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (Math.random() < density && !(r === start.row && c === start.col) && !(r === end.row && c === end.col)) {
            maze[r][c] = 1; // wall
          }
        }
      }

      maze[start.row][start.col] = 0;
      maze[end.row][end.col] = 0;
    }

    function drawMaze(visited = new Set(), path = []) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          ctx.fillStyle = maze[r][c] === 1 ? '#333' : '#fff';
          if (r === start.row && c === start.col) ctx.fillStyle = '#007bff';
          if (r === end.row && c === end.col) ctx.fillStyle = '#ff4d4d';
          if (path.some(([pr, pc]) => pr === r && pc === c)) ctx.fillStyle = '#28a745';
          if (
            visited.has(`${r},${c}`) &&
            !(r === start.row && c === start.col) &&
            !(r === end.row && c === end.col) &&
            !path.some(([pr, pc]) => pr === r && pc === c)
          ) {
            ctx.fillStyle = '#add8e6';
          }
          ctx.fillRect(c * cellSize, r * cellSize, cellSize - 1, cellSize - 1);
        }
      }
    }

    function setStartPoint() {
      settingStart = true;
      settingEnd = false;
      status.textContent = 'Click on the maze to set Start (A) point.';
    }

    function setEndPoint() {
      settingEnd = true;
      settingStart = false;
      status.textContent = 'Click on the maze to set End (B) point.';
    }

    async function findShortestPath() {
      pathVisual.innerHTML = '';
      generateMaze();
      drawMaze();
      await sleep(500);

      const distances = Array(rows).fill().map(() => Array(cols).fill(Infinity));
      const visited = new Set();
      const previous = Array(rows).fill().map(() => Array(cols).fill(null));
      const queue = [[start.row, start.col]];
      distances[start.row][start.col] = 0;

      const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];

      while (queue.length > 0) {
        let minDistance = Infinity;
        let currentIdx = 0;

        for (let i = 0; i < queue.length; i++) {
          const [r, c] = queue[i];
          if (distances[r][c] < minDistance) {
            minDistance = distances[r][c];
            currentIdx = i;
          }
        }

        const [row, col] = queue.splice(currentIdx, 1)[0];
        visited.add(`${row},${col}`);
        drawMaze(visited);
        await sleep(30);

        if (row === end.row && col === end.col) break;

        for (let [dr, dc] of directions) {
          const newRow = row + dr;
          const newCol = col + dc;
          if (
            newRow >= 0 && newRow < rows &&
            newCol >= 0 && newCol < cols &&
            !visited.has(`${newRow},${newCol}`) &&
            maze[newRow][newCol] === 0
          ) {
            const newDistance = distances[row][col] + 1;
            if (newDistance < distances[newRow][newCol]) {
              distances[newRow][newCol] = newDistance;
              previous[newRow][newCol] = [row, col];
              queue.push([newRow, newCol]);
            }
          }
        }
      }

      if (distances[end.row][end.col] === Infinity) {
        alert('No path found from Point A to Point B!');
        return;
      }

      let path = [];
      let current = [end.row, end.col];
      while (current !== null) {
        path.unshift(current);
        current = previous[current[0]][current[1]];
      }

      drawMaze(visited, path);
      await sleep(500);

      for (let [r, c] of path) {
        const div = document.createElement('div');
        div.className = 'element';
        div.textContent = `(${r},${c})`;
        div.classList.add('highlight');
        pathVisual.appendChild(div);
        await sleep(150);
        div.classList.remove('highlight');
      }

      alert(`Shortest path length from (${start.row},${start.col}) to (${end.row},${end.col}): ${distances[end.row][end.col]}`);
    }

    generateMaze();
    drawMaze();
  </script>
</body>
</html>
